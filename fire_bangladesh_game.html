let selectedHero = "male";
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const leftEl=document.getElementById('left'),scoreEl=document.getElementById('score'),healthEl=document.getElementById('health');
let W=0,H=0,player,enemies=[],bullets=[],enemyBullets=[],decor=[],score=0,gameOn=false,ended=false,last=0,zone,elapsed=0;
const joy={x:0,y:0,active:false},keys={};
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;if(player){player.x=Math.min(W-30,Math.max(30,player.x));player.y=Math.min(H-30,Math.max(30,player.y));}}
addEventListener('resize',resize);resize();
const rand=(a,b)=>Math.random()*(b-a)+a,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function spawnEnemy(){let a=rand(0,Math.PI*2),r=rand(Math.min(W,H)*.35,Math.min(W,H)*.55);return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,r:13,hp:2,speed:rand(32,48),cool:rand(.5,2)}}
function start(){player={x:W/2,y:H/2,r:15,hp:100,angle:0,cool:0};enemies=Array.from({length:8},spawnEnemy);bullets=[];enemyBullets=[];decor=Array.from({length:65},()=>({x:rand(0,W),y:rand(0,H),r:rand(3,12),type:Math.random()}));score=0;elapsed=0;zone={x:W/2,y:H/2,r:Math.min(W,H)*.49};gameOn=true;ended=false;document.getElementById('overlay').style.display='none';document.getElementById('restart').style.display='none';}
function end(win){gameOn=false;ended=true;document.querySelector('#overlay h1').textContent=win?'BOOYAH!':'GAME OVER';document.querySelector('#overlay p').innerHTML=win?'দারুণ খেলেছ! তুমি সব শত্রুকে হারিয়েছ।':'তুমি পরাজিত হয়েছ। আবার চেষ্টা করো!<br>স্কোর: '+score;document.getElementById('start').style.display='none';document.getElementById('restart').style.display='inline-block';document.getElementById('overlay').style.display='flex';}
document.getElementById('malePick').onclick=()=>{selectedHero='male';document.getElementById('malePick').style.outline='3px solid #ffc83d';document.getElementById('femalePick').style.outline='none'};
document.getElementById('femalePick').onclick=()=>{selectedHero='female';document.getElementById('femalePick').style.outline='3px solid #ffc83d';document.getElementById('malePick').style.outline='none'};
document.getElementById('start').onclick=start;document.getElementById('restart').onclick=()=>{document.getElementById('start').style.display='inline-block';start()};
function shoot(){if(!gameOn||player.cool>0)return;let target=enemies.filter(e=>e.hp>0).sort((a,b)=>dist(player,a)-dist(player,b))[0];if(target)player.angle=Math.atan2(target.y-player.y,target.x-player.x);else if(Math.hypot(joy.x,joy.y)>.2)player.angle=Math.atan2(joy.y,joy.x);bullets.push({x:player.x+Math.cos(player.angle)*20,y:player.y+Math.sin(player.angle)*20,vx:Math.cos(player.angle)*470,vy:Math.sin(player.angle)*470,life:1.1});player.cool=.22;}
let firing=false;const fireBtn=document.getElementById('fire');fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();firing=true;fireBtn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>fireBtn.addEventListener(ev,()=>firing=false));
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
function setJoy(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/42;joy.y=Math.sin(a)*m/42;knob.style.transform=`translate(${joy.x*36}px,${joy.y*36}px)`}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);joy.active=true;setJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setJoy(e)});function release(e){if(e.pointerId===stickId){stickId=null;joy.x=joy.y=0;joy.active=false;knob.style.transform='translate(0,0)'}}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')firing=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')firing=false});
function update(dt){if(!gameOn)return;elapsed+=dt;player.cool=Math.max(0,player.cool-dt);
let mx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),mag=Math.hypot(mx,my)||1;
player.x=Math.max(18,Math.min(W-18,player.x+mx/mag*190*dt));player.y=Math.max(18,Math.min(H-18,player.y+my/mag*190*dt));
if(firing)shoot();
zone.r=Math.max(Math.min(W,H)*.19,zone.r-1.5*dt);
if(Math.hypot(player.x-zone.x,player.y-zone.y)>zone.r){player.hp-=8*dt;if(player.hp<=0){player.hp=0;end(false)}}
for(let e of enemies){if(e.hp<=0)continue;let d=dist(e,player),a=Math.atan2(player.y-e.y,player.x-e.x);if(d>34){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;}else player.hp-=10*dt;e.cool-=dt;if(e.cool<=0&&d<310){enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,life:2});e.cool=rand(1.2,2.2)}}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;b.life=0;if(e.hp<=0)score++;break}}}
for(let b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+5){player.hp-=12;b.life=0}}
bullets=bullets.filter(b=>b.life>0);enemyBullets=enemyBullets.filter(b=>b.life>0);enemies=enemies.filter(e=>e.hp>0);
if(enemies.length===0)end(true);if(player.hp<=0)end(false);
leftEl.textContent=enemies.length;scoreEl.textContent=score;healthEl.style.width=Math.max(0,player.hp)+'%';
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#27613f';ctx.fillRect(0,0,W,H);
ctx.save();
ctx.globalAlpha=.55;
ctx.fillStyle='#287fb0';
ctx.beginPath();ctx.moveTo(W*.02,H*.18);ctx.bezierCurveTo(W*.24,H*.28,W*.18,H*.48,W*.42,H*.55);ctx.bezierCurveTo(W*.62,H*.62,W*.66,H*.82,W*.98,H*.78);ctx.lineTo(W*.98,H*.91);ctx.bezierCurveTo(W*.68,H*.95,W*.58,H*.73,W*.38,H*.68);ctx.bezierCurveTo(W*.15,H*.60,W*.22,H*.39,W*.02,H*.30);ctx.closePath();ctx.fill();
ctx.globalAlpha=.7;ctx.strokeStyle='#c8b98a';ctx.lineWidth= Math.max(8,Math.min(W,H)*.018);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(W*.05,H*.86);ctx.quadraticCurveTo(W*.38,H*.66,W*.58,H*.48);ctx.quadraticCurveTo(W*.76,H*.30,W*.96,H*.14);ctx.stroke();
ctx.restore();
for(let d of decor){ctx.fillStyle=d.type>.5?'#3d7048':'#6a6841';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();if(d.type>.5){ctx.fillStyle='#234b32';ctx.beginPath();ctx.arc(d.x-2,d.y-2,d.r*.65,0,Math.PI*2);ctx.fill()}}
ctx.save();ctx.strokeStyle='#9de8ff';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.stroke();ctx.restore();
for(let b of bullets){ctx.fillStyle='#ffe16a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(let b of enemyBullets){ctx.fillStyle='#ff704d';ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill()}
for(let e of enemies){ctx.fillStyle='#b63b35';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#f8d5b0';ctx.beginPath();ctx.arc(e.x+4,e.y-4,4,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-12,e.y-21,24,4);ctx.fillStyle='#5cff74';ctx.fillRect(e.x-12,e.y-21,24*(e.hp/2),4)}
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle='#202020';ctx.fillRect(3,-4,29,7);ctx.restore();ctx.save();ctx.beginPath();ctx.arc(player.x,player.y,player.r+3,0,Math.PI*2);ctx.clip();const portrait = selectedHero==='female' ? girlPhoto : heroPhoto; if(portrait.complete&&portrait.naturalWidth){ctx.drawImage(portrait,player.x-player.r-3,player.y-player.r-3,(player.r+3)*2,(player.r+3)*2)}else{ctx.fillStyle='#f0c59a';ctx.fillRect(player.x-player.r,player.y-player.r,player.r*2,player.r*2)}ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.r+3,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('YOU',player.x,player.y-22)}
if(!gameOn&&!ended){ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('BANGLADESH BATTLEFIELD',W/2,H/2+100)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
